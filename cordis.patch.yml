# dsh-wizard-pet 的加载补丁。
#
# 1) 先关掉可能已存在的「上游桌宠」行（DSH Web 全家桶 @linxin666/dsh-web-all 会插入
#    id 为 web-ui-pet 的 @linxin666/dsh-pet）。两只桌宠都占用同一个 pet 服务名，
#    共存时后注册的会接管，容易让人以为装坏了，所以这里直接禁用上游那只。
#    profile 里没有这一行时，这条覆盖会被忽略，不会报错。
# 2) 再插入本插件。
- id: web-ui-pet
  disabled: true
- insert:
    - id: wizard-pet
      name: 'dsh-wizard-pet'
      config:
        # 上游自带的状态装饰是鲸鱼主题，与巫师不搭，关掉
        decorationEnabled: false
